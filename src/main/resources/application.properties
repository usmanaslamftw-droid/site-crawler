server.port=8083
spring.application.name=site-crawler

spring.datasource.url=jdbc:h2:mem:crawldb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

crawler.default-max-depth=3
crawler.default-max-pages=100
crawler.default-threads=5
crawler.default-delay-ms=1000
crawler.user-agent=SiteCrawler/1.0
